<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1e35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Server rack (left) -->
  <g>
    <rect x="40" y="80" width="200" height="280" rx="6" fill="#0d1a2e" stroke="#1e3a5f" stroke-width="2"/>
    <!-- Rack rails -->
    <rect x="48" y="88" width="8" height="264" rx="2" fill="#1a2744"/>
    <rect x="224" y="88" width="8" height="264" rx="2" fill="#1a2744"/>

    <!-- Server units -->
    <!-- Unit 1 -->
    <rect x="60" y="100" width="176" height="36" rx="4" fill="url(#serverGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
    <circle cx="80" cy="118" r="5" fill="#00ff88" filter="url(#glow)"/>
    <rect x="95" y="112" width="80" height="5" rx="2" fill="#00d4ff" opacity="0.5"/>
    <rect x="95" y="121" width="60" height="3" rx="1" fill="#aaa" opacity="0.3"/>
    <rect x="210" y="112" width="16" height="5" rx="2" fill="#00d4ff" opacity="0.6"/>
    <text x="68" y="134" fill="#00d4ff" font-size="8" font-family="monospace" opacity="0.6">nginx</text>

    <!-- Unit 2 -->
    <rect x="60" y="144" width="176" height="36" rx="4" fill="url(#serverGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
    <circle cx="80" cy="162" r="5" fill="#00ff88" filter="url(#glow)"/>
    <rect x="95" y="156" width="95" height="5" rx="2" fill="#00d4ff" opacity="0.5"/>
    <rect x="95" y="165" width="70" height="3" rx="1" fill="#aaa" opacity="0.3"/>
    <rect x="210" y="156" width="16" height="5" rx="2" fill="#00d4ff" opacity="0.6"/>
    <text x="68" y="178" fill="#00d4ff" font-size="8" font-family="monospace" opacity="0.6">grafana</text>

    <!-- Unit 3 -->
    <rect x="60" y="188" width="176" height="36" rx="4" fill="url(#serverGrad)" stroke="#915EFF" stroke-width="1" opacity="0.9"/>
    <circle cx="80" cy="206" r="5" fill="#00ff88" filter="url(#glow)"/>
    <rect x="95" y="200" width="75" height="5" rx="2" fill="#915EFF" opacity="0.5"/>
    <rect x="95" y="209" width="55" height="3" rx="1" fill="#aaa" opacity="0.3"/>
    <rect x="210" y="200" width="16" height="5" rx="2" fill="#915EFF" opacity="0.6"/>
    <text x="68" y="222" fill="#915EFF" font-size="8" font-family="monospace" opacity="0.6">portainer</text>

    <!-- Unit 4 -->
    <rect x="60" y="232" width="176" height="36" rx="4" fill="url(#serverGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
    <circle cx="80" cy="250" r="5" fill="#ffaa00" filter="url(#glow)"/>
    <rect x="95" y="244" width="110" height="5" rx="2" fill="#00d4ff" opacity="0.5"/>
    <rect x="95" y="253" width="80" height="3" rx="1" fill="#aaa" opacity="0.3"/>
    <text x="68" y="266" fill="#00d4ff" font-size="8" font-family="monospace" opacity="0.6">prometheus</text>

    <!-- Unit 5 -->
    <rect x="60" y="276" width="176" height="36" rx="4" fill="url(#serverGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
    <circle cx="80" cy="294" r="5" fill="#00ff88" filter="url(#glow)"/>
    <rect x="95" y="288" width="85" height="5" rx="2" fill="#00d4ff" opacity="0.4"/>
    <rect x="95" y="297" width="65" height="3" rx="1" fill="#aaa" opacity="0.3"/>
    <text x="68" y="310" fill="#00d4ff" font-size="8" font-family="monospace" opacity="0.6">vaultwarden</text>

    <text x="140" y="360" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Server Rack</text>
  </g>

  <!-- Docker whale icon (center) -->
  <g transform="translate(330, 130)" filter="url(#softglow)">
    <!-- Whale body -->
    <ellipse cx="60" cy="80" rx="52" ry="35" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Containers on top of whale -->
    <rect x="18" y="42" width="20" height="16" rx="3" fill="#00d4ff" opacity="0.8"/>
    <rect x="42" y="42" width="20" height="16" rx="3" fill="#00d4ff" opacity="0.8"/>
    <rect x="66" y="42" width="20" height="16" rx="3" fill="#00d4ff" opacity="0.8"/>
    <rect x="30" y="26" width="20" height="16" rx="3" fill="#00d4ff" opacity="0.6"/>
    <rect x="54" y="26" width="20" height="16" rx="3" fill="#00d4ff" opacity="0.6"/>
    <!-- Whale tail -->
    <path d="M 108 70 Q 125 55 118 80 Q 130 75 120 95 Z" fill="#00d4ff" opacity="0.6"/>
    <!-- Whale eye -->
    <circle cx="25" cy="75" r="4" fill="white" opacity="0.9"/>
    <circle cx="26" cy="75" r="2" fill="#0a0f1e"/>
    <!-- Spout -->
    <path d="M 30 42 Q 28 28 35 22 Q 42 28 40 42" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
    <text x="60" y="125" text-anchor="middle" fill="#00d4ff" font-size="12" font-family="monospace">Docker</text>
  </g>

  <!-- Network topology (right side) -->
  <g>
    <!-- Router/Hub -->
    <circle cx="620" cy="160" r="28" fill="#0d1a2e" stroke="#00ff88" stroke-width="2" filter="url(#glow)"/>
    <text x="620" y="155" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace">Router</text>
    <text x="620" y="168" text-anchor="middle" fill="#00ff88" font-size="9" font-family="monospace">/ DNS</text>

    <!-- Connected nodes -->
    <!-- Node 1: VPN -->
    <circle cx="700" cy="90" r="22" fill="#0d1a2e" stroke="#915EFF" stroke-width="1.5"/>
    <text x="700" y="87" text-anchor="middle" fill="#915EFF" font-size="8" font-family="monospace">WireGuard</text>
    <text x="700" y="99" text-anchor="middle" fill="#915EFF" font-size="8" font-family="monospace">VPN</text>
    <line x1="644" y1="145" x2="680" y2="107" stroke="#915EFF" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Node 2: Monitoring -->
    <circle cx="730" cy="185" r="22" fill="#0d1a2e" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="730" y="182" text-anchor="middle" fill="#00d4ff" font-size="8" font-family="monospace">Monitor</text>
    <text x="730" y="194" text-anchor="middle" fill="#00d4ff" font-size="8" font-family="monospace">+Alerts</text>
    <line x1="648" y1="163" x2="708" y2="177" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Node 3: Storage -->
    <circle cx="700" cy="255" r="22" fill="#0d1a2e" stroke="#00ff88" stroke-width="1.5"/>
    <text x="700" y="252" text-anchor="middle" fill="#00ff88" font-size="8" font-family="monospace">NFS</text>
    <text x="700" y="264" text-anchor="middle" fill="#00ff88" font-size="8" font-family="monospace">Storage</text>
    <line x1="638" y1="181" x2="682" y2="240" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Node 4: Firewall -->
    <circle cx="555" cy="90" r="22" fill="#0d1a2e" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="555" y="87" text-anchor="middle" fill="#ff6b6b" font-size="8" font-family="monospace">UFW</text>
    <text x="555" y="99" text-anchor="middle" fill="#ff6b6b" font-size="8" font-family="monospace">Firewall</text>
    <line x1="601" y1="140" x2="572" y2="109" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <text x="620" y="300" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Private Network</text>
  </g>

  <!-- Connection arrows: server → docker → network -->
  <g filter="url(#glow)" opacity="0.8">
    <line x1="240" y1="220" x2="330" y2="200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="330,195 342,200 330,205" fill="#00d4ff"/>
    <line x1="460" y1="185" x2="535" y2="175" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="535,170 547,175 535,180" fill="#00ff88"/>
  </g>

  <!-- Linux terminal snippet bottom -->
  <rect x="100" y="375" width="600" height="80" rx="8" fill="#0d1a2e" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="122" cy="391" r="5" fill="#ff5f57"/>
  <circle cx="140" cy="391" r="5" fill="#ffbd2e"/>
  <circle cx="158" cy="391" r="5" fill="#28c840"/>
  <text x="118" y="414" fill="#00ff88" font-size="11" font-family="monospace">$</text>
  <text x="130" y="414" fill="#aaa" font-size="11" font-family="monospace">docker ps --format "table {{.Names}}\t{{.Status}}"</text>
  <text x="118" y="432" fill="#00d4ff" font-size="10" font-family="monospace">nginx        Up 14 days   grafana      Up 14 days   portainer    Up 14 days</text>

  <!-- Title -->
  <text x="400" y="56" text-anchor="middle" fill="url(#accent)" font-size="14" font-family="monospace" filter="url(#glow)">Personal Homelab &amp; Infrastructure</text>
  <text x="400" y="478" text-anchor="middle" fill="#aaa" font-size="13" font-family="monospace">Docker · Linux · Self-hosting · Networking</text>
</svg>
