<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#915EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a5a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#915EFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="133" y1="0" x2="133" y2="500"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
    <line x1="666" y1="0" x2="666" y2="500"/>
  </g>

  <!-- Left: Document cards -->
  <g>
    <!-- Doc 1 -->
    <rect x="40" y="100" width="160" height="200" rx="8" fill="url(#docGrad)" stroke="#915EFF" stroke-width="1" opacity="0.9"/>
    <rect x="58" y="120" width="100" height="6" rx="3" fill="#915EFF" opacity="0.7"/>
    <rect x="58" y="136" width="124" height="4" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="58" y="148" width="110" height="4" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="58" y="160" width="118" height="4" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="58" y="172" width="90" height="4" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="58" y="192" width="124" height="4" rx="2" fill="#aaa" opacity="0.3"/>
    <rect x="58" y="204" width="100" height="4" rx="2" fill="#aaa" opacity="0.3"/>
    <rect x="58" y="216" width="115" height="4" rx="2" fill="#aaa" opacity="0.3"/>
    <rect x="58" y="228" width="80" height="4" rx="2" fill="#aaa" opacity="0.3"/>
    <text x="120" y="285" text-anchor="middle" fill="#915EFF" font-size="11" font-family="monospace" opacity="0.9">document.pdf</text>

    <!-- Doc 2 (slightly behind/offset) -->
    <rect x="55" y="88" width="160" height="200" rx="8" fill="url(#docGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Arrows pointing right (doc → vector db) -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="210" y1="200" x2="310" y2="200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="310,195 322,200 310,205" fill="#915EFF"/>
  </g>

  <!-- Center: Vector DB -->
  <g>
    <!-- Cylinder shape for vector DB -->
    <ellipse cx="390" cy="165" rx="60" ry="18" fill="#1e1e3f" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="330" y="165" width="120" height="70" fill="#1a1a35" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="330" y1="165" x2="330" y2="235" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="450" y1="165" x2="450" y2="235" stroke="#00d4ff" stroke-width="1.5"/>
    <ellipse cx="390" cy="235" rx="60" ry="18" fill="#1e1e3f" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Vector dots inside -->
    <circle cx="365" cy="195" r="3" fill="#00d4ff" opacity="0.8"/>
    <circle cx="390" cy="185" r="3" fill="#915EFF" opacity="0.8"/>
    <circle cx="415" cy="200" r="3" fill="#00d4ff" opacity="0.8"/>
    <circle cx="375" cy="215" r="3" fill="#915EFF" opacity="0.8"/>
    <circle cx="405" cy="210" r="3" fill="#00d4ff" opacity="0.8"/>
    <!-- Connection lines between dots -->
    <line x1="365" y1="195" x2="390" y2="185" stroke="#915EFF" stroke-width="0.8" opacity="0.5"/>
    <line x1="390" y1="185" x2="415" y2="200" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="415" y1="200" x2="405" y2="210" stroke="#915EFF" stroke-width="0.8" opacity="0.5"/>
    <line x1="375" y1="215" x2="405" y2="210" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
    <text x="390" y="268" text-anchor="middle" fill="#00d4ff" font-size="11" font-family="monospace">Vector DB</text>
  </g>

  <!-- Arrow: Vector DB → LLM -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="452" y1="200" x2="522" y2="200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="522,195 534,200 522,205" fill="#00d4ff"/>
  </g>

  <!-- Right: LLM Brain / Response box -->
  <g>
    <!-- Brain/LLM circle -->
    <circle cx="608" cy="165" r="55" fill="#1e1e3f" stroke="#915EFF" stroke-width="1.5"/>
    <!-- Neural network inside -->
    <circle cx="593" cy="148" r="5" fill="#915EFF" opacity="0.9"/>
    <circle cx="623" cy="148" r="5" fill="#915EFF" opacity="0.9"/>
    <circle cx="580" cy="168" r="5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="608" cy="162" r="5" fill="#915EFF" opacity="0.9"/>
    <circle cx="636" cy="168" r="5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="593" cy="183" r="5" fill="#915EFF" opacity="0.9"/>
    <circle cx="623" cy="183" r="5" fill="#915EFF" opacity="0.9"/>
    <!-- Neural connections -->
    <line x1="593" y1="148" x2="580" y2="168" stroke="#915EFF" stroke-width="1" opacity="0.5"/>
    <line x1="593" y1="148" x2="608" y2="162" stroke="#915EFF" stroke-width="1" opacity="0.5"/>
    <line x1="623" y1="148" x2="608" y2="162" stroke="#915EFF" stroke-width="1" opacity="0.5"/>
    <line x1="623" y1="148" x2="636" y2="168" stroke="#915EFF" stroke-width="1" opacity="0.5"/>
    <line x1="580" y1="168" x2="593" y2="183" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="608" y1="162" x2="593" y2="183" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="608" y1="162" x2="623" y2="183" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="636" y1="168" x2="623" y2="183" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="608" y="237" text-anchor="middle" fill="#915EFF" font-size="11" font-family="monospace">LLM</text>

    <!-- Response bubble -->
    <rect x="530" y="290" width="220" height="80" rx="10" fill="#1e1e3f" stroke="#915EFF" stroke-width="1"/>
    <polygon points="608,290 595,272 621,272" fill="#1e1e3f" stroke="#915EFF" stroke-width="1"/>
    <rect x="548" y="308" width="160" height="5" rx="2" fill="#915EFF" opacity="0.6"/>
    <rect x="548" y="320" width="185" height="5" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="548" y="332" width="140" height="5" rx="2" fill="#aaa" opacity="0.4"/>
    <rect x="548" y="344" width="160" height="5" rx="2" fill="#aaa" opacity="0.3"/>
  </g>

  <!-- Query box at bottom center -->
  <rect x="260" y="360" width="280" height="50" rx="8" fill="#1e1e3f" stroke="#00d4ff" stroke-width="1"/>
  <text x="270" y="380" fill="#00d4ff" font-size="11" font-family="monospace" opacity="0.7">&gt; Query: "Explain section 3..."</text>
  <rect x="270" y="390" width="80" height="4" rx="2" fill="#00d4ff" opacity="0.3"/>

  <!-- Title / Labels -->
  <text x="400" y="450" text-anchor="middle" fill="white" font-size="22" font-family="Arial, sans-serif" font-weight="bold">RAG Pipeline</text>
  <text x="400" y="472" text-anchor="middle" fill="#aaa" font-size="13" font-family="monospace">Python · LangChain · Vector Databases · LLM</text>

  <!-- Top label -->
  <text x="400" y="40" text-anchor="middle" fill="url(#accent)" font-size="14" font-family="monospace" filter="url(#glow)">Retrieval-Augmented Generation</text>

  <!-- Step labels -->
  <text x="120" y="330" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">1. Ingest</text>
  <text x="390" y="300" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">2. Embed</text>
  <text x="608" y="265" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">3. Retrieve &amp; Generate</text>
</svg>
