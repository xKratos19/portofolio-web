server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite + React SPA (react-router-dom support)
    location / {
        try_files $uri /index.html;
    }

    # Optional, but nice: gzip for smaller responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
